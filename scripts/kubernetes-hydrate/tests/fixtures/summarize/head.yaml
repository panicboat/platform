apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  versions:
    - name: v1alpha1
      served: false
      storage: false
    - name: v1
      served: true
      storage: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: ns-a
spec:
  template:
    spec:
      initContainers:
        - name: init
          image: busybox:1.36
      containers:
        - name: app
          image: registry.example.com/app:2.0
          args:
            - --config-reloader=quay.io/example/reloader:v0.94.1
            - --log-level=info
          env:
            - name: HELPER_IMAGE
              value: ghcr.io/example/helper:2.0
            - name: ENDPOINT
              value: http://example.com/path:8080
        - name: sidecar
          image: localhost:5000/sidecar:0.1@sha256:abc
        - name: untagged
          image: nginx
---
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: main
  namespace: ns-a
spec:
  image: quay.io/prometheus/prometheus:v3.15.0
  version: v3.15.0
  thanos:
    image:
      repository: quay.io/thanos/thanos
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: new
  namespace: ns-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reader

name: 'Terragrunt Action'
description: 'Execute terragrunt plan or apply with AWS OIDC'

inputs:
  token:
    description: 'GitHub token with required permissions'
    required: true
  service-name:
    description: 'Service name for terragrunt execution'
    required: true
  environment:
    description: 'Environment name (develop, staging, production, etc.)'
    required: true
  action-type:
    description: 'Action type: plan or apply'
    required: true
  iam-role:
    description: 'IAM role for plan/apply operations'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
  working-directory:
    description: 'Working directory for terragrunt execution'
    required: true
  pr-number:
    description: 'Pull request number for commenting'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
      with:
        role-to-assume: ${{ inputs.iam-role }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: GitHubActions-Terragrunt-${{ inputs.action-type }}-${{ inputs.environment }}
        audience: sts.amazonaws.com

    # AQUA_CONFIG stays unset so aqua finds the caller's root aqua.yaml, the same one local shells use.
    - name: Setup aqua
      uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
      with:
        aqua_version: v2.48.2

    - name: Execute Terragrunt
      id: terragrunt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_INPUT: 'false'
        GITHUB_TOKEN: ${{ inputs.token }}
        ACTION_TYPE: ${{ inputs.action-type }}
      run: |
        args=("$ACTION_TYPE" -no-color)
        [ "$ACTION_TYPE" = apply ] && args+=(-auto-approve)
        # The step shell runs with -e, so the exit code must be captured inside the condition.
        if terragrunt "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/terragrunt.log"; then code=0; else code=$?; fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Render the PR comment
      if: always() && inputs.pr-number != ''
      shell: bash
      env:
        ACTION_TYPE: ${{ inputs.action-type }}
        SERVICE_NAME: ${{ inputs.service-name }}
        ENVIRONMENT: ${{ inputs.environment }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EXIT_CODE: ${{ steps.terragrunt.outputs.exit-code }}
      run: bash "$GITHUB_ACTION_PATH/render-comment.sh" "$RUNNER_TEMP/terragrunt.log" "$EXIT_CODE" > "$RUNNER_TEMP/terragrunt-comment.md"

    - name: Comment PR with Terragrunt results
      if: always() && inputs.pr-number != ''
      uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
      with:
        file-path: ${{ runner.temp }}/terragrunt-comment.md
        comment-tag: "terragrunt-${{ inputs.service-name }}-${{ inputs.environment }}-${{ inputs.action-type }}"
        mode: upsert
        pr-number: ${{ inputs.pr-number }}
        github-token: ${{ inputs.token }}
        reactions: ${{ steps.terragrunt.outputs.exit-code == '0' && 'rocket' || 'confused' }}
      continue-on-error: true

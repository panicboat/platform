# Tests the terragrunt release scripts and validates workflow-config.yaml and the release-please configs.
name: Test Terragrunt Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test terragrunt release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/terragrunt-release/test.sh
      - run: bash .github/scripts/terragrunt-release/validate-apply-trigger.sh
      - run: bash .github/scripts/terragrunt-release/check-release-configs.sh

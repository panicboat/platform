# Runs release-please for each aws/{service} config to open release pull requests and publish releases.
name: 'Release - Please'

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--release--please.yaml@8ec6f461b570e0d12ae2f3cc2d2e39569b1c4c55 # v3.1.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

# Runs release-please for each aws/{service} config to open release pull requests and publish releases.
name: 'Release - Please'

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--release--please.yaml@c7e840647bcbae967cde37c6d32d39e70029f722 # v0.3.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

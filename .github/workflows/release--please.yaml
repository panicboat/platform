# Runs release-please for each aws/{service} config to open release pull requests and publish releases.
name: 'Release - Please'

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--release--please.yaml@5c8d1e2a12c97f93b40399902879acd68497a8d9 # v3.3.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

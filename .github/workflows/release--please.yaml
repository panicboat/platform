# Runs release-please for each aws/{service} config to open release pull requests and publish releases.
name: 'Release - Please'

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--release--please.yaml@5cdc9877edabfc6f69bf8c8a339ac8f2f57a7cc3 # v0.3.4
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

# Resolves deploy labels into targets, plans them on pull requests, and applies non-production targets on push to main.
name: 'Label Base Deploy - Resolver'

on:
  pull_request:
    types: [labeled]
    branches:
      - '**'
  push:
    branches:
      - main

concurrency:
  group: label-base-deploy-resolver-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolver:
    permissions:
      id-token: write
      contents: write # the helmfile hydrator pushes hydrated manifests
      pull-requests: write
    uses: panicboat/.github/.github/workflows/reusable--label-base-deploy--resolver.yaml@8b7584f3294fd588e49f7f652cfb1b09a3aa6611 # v0.3.3
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

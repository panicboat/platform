# Waits for every other workflow on a pull request so that one required check gates the merge.
name: 'CI Gatekeeper'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  ci-gatekeeper:
    permissions:
      actions: read
    uses: panicboat/.github/.github/workflows/reusable--ci-gatekeeper.yaml@c7e840647bcbae967cde37c6d32d39e70029f722 # v0.3.0
    with:
      # The AI review is advisory; an Anthropic API outage must not block merges through this required check.
      exclude-workflow-names: Renovate Major Review

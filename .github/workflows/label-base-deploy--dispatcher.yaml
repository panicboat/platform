# Adds deploy:{service} labels to a pull request from the files it changes under each service root.
name: 'Label Base Deploy - Dispatcher'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  dispatch-labels:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: panicboat/.github/.github/workflows/reusable--label-base-deploy--dispatcher.yaml@5cdc9877edabfc6f69bf8c8a339ac8f2f57a7cc3 # v0.3.4
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

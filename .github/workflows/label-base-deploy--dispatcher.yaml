# Adds deploy:{service} labels to a pull request from the stack paths it changes.
name: 'Label Base Deploy - Dispatcher'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  dispatch-labels:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: panicboat/.github/.github/workflows/reusable--label-base-deploy--dispatcher.yaml@8ec6f461b570e0d12ae2f3cc2d2e39569b1c4c55 # v3.1.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

# Adds deploy:{service} labels to a pull request from the stack paths it changes.
name: 'Label Base Deploy - Dispatcher'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  dispatch-labels:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: panicboat/.github/.github/workflows/reusable--label-base-deploy--dispatcher.yaml@d54532665675f1843914da4b324dc2a58dd37239 # v1.0.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

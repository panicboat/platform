# Adds deploy:{service} labels to a pull request from the files it changes under each service root.
name: 'Label Base Deploy - Dispatcher'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  dispatch-labels:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: panicboat/.github/.github/workflows/reusable--label-base-deploy--dispatcher.yaml@2b5d0c6af56ca62e19b2bf4e76b55c0813a1c443 # v0.1.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

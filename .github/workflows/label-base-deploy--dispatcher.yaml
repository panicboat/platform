# Adds deploy:{service} labels to a pull request from the stack paths it changes.
name: 'Label Base Deploy - Dispatcher'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  dispatch-labels:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: panicboat/.github/.github/workflows/reusable--label-base-deploy--dispatcher.yaml@abf935e759c635244c5ba4646d852a73693944d6 # v3.1.1
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

# Checks that every action is pinned to a full commit SHA.
name: Lint GitHub Actions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ensure-sha-pinned:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--lint-actions.yaml@8ec6f461b570e0d12ae2f3cc2d2e39569b1c4c55 # v3.1.0

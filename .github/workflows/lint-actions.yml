# Checks that every action is pinned to a full commit SHA.
name: Lint GitHub Actions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ensure-sha-pinned:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--lint-actions.yaml@5cdc9877edabfc6f69bf8c8a339ac8f2f57a7cc3 # v0.3.4

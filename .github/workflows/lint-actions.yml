# Checks that every action is pinned to a full commit SHA.
name: Lint GitHub Actions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ensure-sha-pinned:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--lint-actions.yaml@2b5d0c6af56ca62e19b2bf4e76b55c0813a1c443 # v0.1.0

# Checks that every action is pinned to a full commit SHA.
name: Lint GitHub Actions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ensure-sha-pinned:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--lint-actions.yaml@5c8d1e2a12c97f93b40399902879acd68497a8d9 # v3.3.0

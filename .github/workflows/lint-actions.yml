# Checks that every action is pinned to a full commit SHA.
name: Lint GitHub Actions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ensure-sha-pinned:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--lint-actions.yaml@cf98ce094f5e91cfc9072b5e401d9ed371bf0719 # v3.0.0

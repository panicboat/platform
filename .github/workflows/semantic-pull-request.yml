# Validates that the pull request title follows Conventional Commits.
name: Semantic Pull Request

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--semantic-pull-request.yaml@2b5d0c6af56ca62e19b2bf4e76b55c0813a1c443 # v0.1.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

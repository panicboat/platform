# Validates that the pull request title follows Conventional Commits.
name: Semantic Pull Request

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--semantic-pull-request.yaml@8ec6f461b570e0d12ae2f3cc2d2e39569b1c4c55 # v3.1.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

# Validates that the pull request title follows Conventional Commits.
name: Semantic Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--semantic-pull-request.yaml@5cdc9877edabfc6f69bf8c8a339ac8f2f57a7cc3 # v0.3.4
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

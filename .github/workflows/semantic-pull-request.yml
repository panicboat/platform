# Validates that the pull request title follows Conventional Commits.
name: Semantic Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--semantic-pull-request.yaml@8b7584f3294fd588e49f7f652cfb1b09a3aa6611 # v0.3.3
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

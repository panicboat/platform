# Validates that the pull request title follows Conventional Commits.
name: Semantic Pull Request

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    permissions:
      contents: read
    uses: panicboat/.github/.github/workflows/reusable--semantic-pull-request.yaml@abf935e759c635244c5ba4646d852a73693944d6 # v3.1.1
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

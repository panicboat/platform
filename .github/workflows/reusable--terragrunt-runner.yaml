# Runs terragrunt plan or apply in one working directory and reports the result with tfcmt.
name: 'Reusable - Terragrunt Runner'

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: 'Service name for terragrunt execution'
      environment:
        required: true
        type: string
        description: 'Environment name (develop, staging, production, etc.)'
      action-type:
        required: true
        type: string
        description: 'Action type: plan or apply'
      iam-role:
        required: true
        type: string
        description: 'IAM role for plan/apply operations'
      aws-region:
        required: true
        type: string
        description: 'AWS region'
      working-directory:
        required: true
        type: string
        description: 'Working directory for terragrunt execution'
      app-id:
        required: true
        type: string
        description: 'GitHub App ID for authentication'
      ref:
        required: false
        type: string
        default: ''
        description: 'Git ref to check out (defaults to the triggering ref)'
      github-environment:
        required: false
        type: string
        default: ''
        description: 'GitHub environment the job runs in (none when empty)'
    secrets:
      private-key:
        required: true
        description: 'GitHub App private key for authentication'

jobs:
  run-terragrunt:
    name: 'Run Terragrunt'
    if: inputs.action-type != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.private-key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.iam-role }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: GitHubActions-Terragrunt-${{ inputs.action-type }}-${{ inputs.environment }}
          audience: sts.amazonaws.com

      - name: Setup aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0

      - name: Run Terragrunt
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TF_INPUT: 'false'
          # tfcmt cannot parse the output while terragrunt prefixes each line with its log metadata.
          TG_LOG_DISABLE: 'true'
          TFCMT_PLAN_PATCH: 'true'
          TFCMT_DISABLE_LABEL: 'true'
          SERVICE_NAME: ${{ inputs.service-name }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION_TYPE: ${{ inputs.action-type }}
        run: tfcmt -var "target:$SERVICE_NAME/$ENVIRONMENT" "$ACTION_TYPE" -- terragrunt "$ACTION_TYPE" -no-color ${{ inputs.action-type == 'apply' && '-auto-approve' || '' }}

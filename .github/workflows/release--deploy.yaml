# Applies a service's production environment when its release is published or its tag is dispatched.
name: 'Release - Deploy'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)apply (e.g. vpc-v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-deploy-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release-deploy:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: panicboat/.github/.github/workflows/reusable--release--deploy.yaml@2b5d0c6af56ca62e19b2bf4e76b55c0813a1c443 # v4.0.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

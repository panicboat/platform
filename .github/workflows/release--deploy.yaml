# Applies a service's production environment when its release is published or its tag is dispatched.
name: 'Release - Deploy'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)apply (e.g. vpc-v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-deploy-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release-deploy:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: panicboat/.github/.github/workflows/reusable--release--deploy.yaml@b4045cb25420c5b596ad99c7e51106062feec5ab # v0.3.1
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

# Reviews Renovate major-update pull requests with Claude and posts the review.
name: 'Renovate Major Review'

on:
  pull_request:
    types: [labeled]

permissions: {}

concurrency:
  # Label name keeps runs for other labels Renovate adds at the same time from cancelling the review.
  group: renovate-major-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: panicboat/.github/.github/workflows/reusable--renovate-major-review.yaml@c7e840647bcbae967cde37c6d32d39e70029f722 # v0.3.0
    with:
      prompt-path: .github/prompts/renovate-major-review.md

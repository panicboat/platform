# Plans a service's production environment on its release-please pull request.
name: 'Release - Plan'

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  release-plan:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: panicboat/.github/.github/workflows/reusable--release--plan.yaml@2b5d0c6af56ca62e19b2bf4e76b55c0813a1c443 # v4.0.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

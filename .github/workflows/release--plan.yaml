# Plans a service's apply_trigger: release environments on its release-please pull request.
name: 'Release - Plan'

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  release-plan:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: panicboat/.github/.github/workflows/reusable--release--plan.yaml@abf935e759c635244c5ba4646d852a73693944d6 # v3.1.1
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

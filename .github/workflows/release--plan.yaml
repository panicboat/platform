# Plans a service's production environment on its release-please pull request.
name: 'Release - Plan'

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  release-plan:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: panicboat/.github/.github/workflows/reusable--release--plan.yaml@b4045cb25420c5b596ad99c7e51106062feec5ab # v0.3.1
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

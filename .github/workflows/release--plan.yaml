# Plans a service's production environment on its release-please pull request.
name: 'Release - Plan'

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  release-plan:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: panicboat/.github/.github/workflows/reusable--release--plan.yaml@8b7584f3294fd588e49f7f652cfb1b09a3aa6611 # v0.3.3
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

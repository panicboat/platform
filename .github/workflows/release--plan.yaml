# Plans a service's apply_trigger: release environments on its release-please pull request.
name: 'Release - Plan'

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  release-plan:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: panicboat/.github/.github/workflows/reusable--release--plan.yaml@8ec6f461b570e0d12ae2f3cc2d2e39569b1c4c55 # v3.1.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

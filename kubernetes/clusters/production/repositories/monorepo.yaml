apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: monorepo
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/panicboat/monorepo.git
  ref:
    branch: main
  provider: github
  secretRef:
    name: panicboat-github-app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monorepo-cluster
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./clusters/production"
  prune: true
  sourceRef:
    kind: GitRepository
    name: monorepo
  suspend: false
---
# Syncs dedicated read-only GitHub App credentials for monorepo cloning.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: panicboat-github-app
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: panicboat-github-app
    creationPolicy: Owner
  data:
    - secretKey: githubAppID
      remoteRef:
        key: github-app/fluxcd-bot
        property: app_id
    - secretKey: githubAppInstallationID
      remoteRef:
        key: github-app/fluxcd-bot
        property: installation_id
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: github-app/fluxcd-bot
        property: private_key

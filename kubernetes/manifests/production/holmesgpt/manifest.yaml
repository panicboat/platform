kind: ConfigMap
metadata:
  name: custom-toolsets-configmap
  namespace: holmesgpt
data:
  custom_toolset.yaml: |-
    toolsets: 
      bash:
        config:
          builtin_allowlist: core
        enabled: true
      connectivity_check:
        enabled: true
      internet:
        enabled: true
      kubernetes/core:
        enabled: true
      kubernetes/logs:
        enabled: true
      prometheus/metrics:
        config:
          prometheus_url: http://mimir-distributed-gateway.monitoring.svc.cluster.local/prometheus
        enabled: true
      robusta:
        enabled: false
      skills:
        enabled: true
    mcp_servers: 
      {}
  model_list.yaml: |-
    opus-5:
      model: bedrock/us.anthropic.claude-opus-5
      temperature: 0
    sonnet-4-6:
      model: bedrock/us.anthropic.claude-sonnet-4-6
      temperature: 0
    sonnet-5:
      model: bedrock/us.anthropic.claude-sonnet-5

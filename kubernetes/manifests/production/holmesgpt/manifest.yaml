# Source: holmes/templates/holmes.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmesgpt-holmes
  namespace: holmesgpt
  labels:
    app: holmes
    
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: holmes
  template:
    metadata:
      labels:
        app: holmes
        
      annotations:
        # checksum annotation triggering pod reload when .Values.toolsets changes by helm upgrade
        checksum/toolset-config: 915b78204910d634799c7d48cd973206f4405f149fb3fe826616c31e9f61b6ae
    spec:
      serviceAccountName: holmesgpt
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      dnsPolicy: ClusterFirst
      containers:
      - name: holmes
        image: "robustadev/holmes:0.39.0"
        imagePullPolicy: IfNotPresent
        # Read-only root filesystem for security hardening.
        # /tmp is mounted as a writable emptyDir for ephemeral tool result files.
        # Required for OpenShift restricted SCC and other security-hardened
        # environments that enforce read-only root filesystems.
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command: ["python3", "-u", "server.py"]
        ports:
        - containerPort: 5050
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
          - name: LOG_LEVEL
            value: INFO
          - name: ENABLE_JSON_LOGS_FORMAT
            value: "false"
          - name: ENABLE_TELEMETRY
            value: "true"
          - name: SENTRY_DSN
            value: 
          
          
          - name: AWS_REGION_NAME
            value: us-east-1
        lifecycle:
          preStop:
            exec:
              command: ["bash", "-c", "kill -SIGINT 1"]
        volumeMounts:
          - name: tmp-volume
            mountPath: /tmp
          - name: playbooks-config-secret
            mountPath: /etc/robusta/config
          - name: custom-toolsets-configmap
            mountPath: /etc/holmes/config
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 2Gi
            
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 256Mi
        - name: playbooks-config-secret
          secret:
            secretName: robusta-playbooks-config-secret
            optional: true
        - name: custom-toolsets-configmap
          configMap:
            name: custom-toolsets-configmap
            optional: true


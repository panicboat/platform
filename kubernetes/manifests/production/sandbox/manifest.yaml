---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: sandbox
  name: sandbox
  namespace: sandbox
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: sandbox
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    app.kubernetes.io/name: sandbox
  name: sandbox
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          mkdir -p /app
          printf '<!doctype html>\n<h1>sandbox: cluster</h1>\n' > /app/index.html
          exec python -m http.server 8080 --directory /app
        image: python:3.13-slim
        name: sandbox
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi

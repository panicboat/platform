---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: backend
  name: backend
  namespace: sandbox
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: backend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: backend
  name: backend
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
      - command:
        - python
        - -u
        - -c
        - |
          import http.server, socketserver, threading, time

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.end_headers()
                  self.wfile.write(b"backend ok\n")

              def log_message(self, *args):
                  pass

          socketserver.TCPServer.allow_reuse_address = True
          server = socketserver.TCPServer(("", 8080), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          print("backend: serving on 8080", flush=True)

          blob = []
          while True:
              blob.append(bytearray(8 * 1024 * 1024))
              print(f"backend: allocated {len(blob) * 8} MiB", flush=True)
              time.sleep(5)
        image: python:3.13-slim
        name: backend
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: frontend
  name: frontend
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
      - command:
        - python
        - -u
        - -c
        - |
          import time, urllib.request

          while True:
              try:
                  with urllib.request.urlopen("http://backend:8080/", timeout=2) as response:
                      response.read()
                  print("frontend: request ok", flush=True)
              except Exception as error:
                  print(f"frontend: request failed: {error}", flush=True)
              time.sleep(1)
        image: python:3.13-slim
        name: frontend
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi

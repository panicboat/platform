# Source: keycloakx/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    alb.ingress.kubernetes.io/group.name: "application"
    alb.ingress.kubernetes.io/healthcheck-path: "/"
    alb.ingress.kubernetes.io/healthcheck-port: "traffic-port"
    alb.ingress.kubernetes.io/listen-ports: "[{\"HTTPS\":443}]"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/success-codes: "200-499"
    alb.ingress.kubernetes.io/target-type: "ip"
    external-dns.alpha.kubernetes.io/hostname: "auth.dystopia.city"
  labels:
    helm.sh/chart: keycloakx-7.2.2
    app.kubernetes.io/name: keycloakx
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/version: "26.6.4"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: alb
  rules:
    - host: "auth.dystopia.city"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: keycloak-http
                port:
                  name: http

---
apiVersion: v1
data:
  dystopia-realm.json: |
    {
      "realm": "dystopia",
      "enabled": true,
      "displayName": "dystopia.city",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "resetPasswordAllowed": true,
      "identityProviders": [
        {
          "alias": "google",
          "providerId": "google",
          "enabled": true,
          "trustEmail": true,
          "storeToken": false,
          "addReadTokenRoleOnCreate": false,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "clientId": "$(env:GOOGLE_CLIENT_ID)",
            "clientSecret": "$(env:GOOGLE_CLIENT_SECRET)",
            "syncMode": "IMPORT",
            "useJwksUrl": "true"
          }
        }
      ],
      "clients": [
        {
          "clientId": "dystopia-app",
          "name": "dystopia.city application",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "https://dystopia.city/*"
          ],
          "webOrigins": [
            "https://dystopia.city"
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-config
  namespace: keycloak
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-config
    spec:
      containers:
      - env:
        - name: KEYCLOAK_URL
          value: http://keycloak.keycloak.svc.cluster.local
        - name: KEYCLOAK_USER
          valueFrom:
            secretKeyRef:
              key: KEYCLOAK_ADMIN
              name: keycloak-admin
        - name: KEYCLOAK_PASSWORD
          valueFrom:
            secretKeyRef:
              key: KEYCLOAK_ADMIN_PASSWORD
              name: keycloak-admin
        - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
          value: "true"
        - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
          value: 300s
        - name: IMPORT_FILES_LOCATIONS
          value: /config/*
        - name: IMPORT_VARSUBSTITUTION_ENABLED
          value: "true"
        envFrom:
        - secretRef:
            name: keycloak-google-idp
        image: adorsys/keycloak-config-cli:6.5.1-26
        name: keycloak-config-cli
        volumeMounts:
        - mountPath: /config
          name: realm-import
          readOnly: true
      restartPolicy: OnFailure
      volumes:
      - configMap:
          name: keycloak-realm-import
        name: realm-import
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  data:
  - remoteRef:
      key: panicboat/keycloak/admin
      property: KEYCLOAK_ADMIN
    secretKey: KEYCLOAK_ADMIN
  - remoteRef:
      key: panicboat/keycloak/admin
      property: KEYCLOAK_ADMIN_PASSWORD
    secretKey: KEYCLOAK_ADMIN_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    name: keycloak-admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-database
  namespace: keycloak
spec:
  data:
  - remoteRef:
      key: panicboat/keycloak/database
      property: KC_DB_URL_HOST
    secretKey: KC_DB_URL_HOST
  - remoteRef:
      key: panicboat/keycloak/database
      property: KC_DB_URL_PORT
    secretKey: KC_DB_URL_PORT
  - remoteRef:
      key: panicboat/keycloak/database
      property: KC_DB_URL_DATABASE
    secretKey: KC_DB_URL_DATABASE
  - remoteRef:
      key: panicboat/keycloak/database
      property: KC_DB_USERNAME
    secretKey: KC_DB_USERNAME
  - remoteRef:
      key: panicboat/keycloak/database
      property: KC_DB_PASSWORD
    secretKey: KC_DB_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    name: keycloak-database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-google-idp
  namespace: keycloak
spec:
  data:
  - remoteRef:
      key: panicboat/keycloak/google-idp
      property: client_id
    secretKey: GOOGLE_CLIENT_ID
  - remoteRef:
      key: panicboat/keycloak/google-idp
      property: client_secret
    secretKey: GOOGLE_CLIENT_SECRET
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    name: keycloak-google-idp

# 個別Helm chartへのtrafficDistribution設定は設定漏れリスクがあるため
# cluster-wideに一括注入する (docs/superpowers/plans/2026-09-16-eks-cross-az-cost.md)。
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: default-traffic-distribution
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: not-headless
      expression: "object.spec.clusterIP != 'None'"
    - name: not-external-name
      expression: "object.spec.type != 'ExternalName'"
  failurePolicy: Ignore
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              trafficDistribution: has(object.spec.trafficDistribution) ? object.spec.trafficDistribution : "PreferSameZone"
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: default-traffic-distribution-binding
spec:
  policyName: default-traffic-distribution

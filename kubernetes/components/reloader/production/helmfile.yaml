environments:
  production:
---
repositories:
  - name: stakater
    url: https://stakater.github.io/stakater-charts

# API version flag ensures ServiceMonitor renders during offline helmfile templating.
helmDefaults:
  args:
    - "--api-versions=monitoring.coreos.com/v1"

releases:
  - name: reloader
    namespace: reloader
    chart: stakater/reloader
    version: "2.2.17"
    values:
      - values.yaml.gotmpl

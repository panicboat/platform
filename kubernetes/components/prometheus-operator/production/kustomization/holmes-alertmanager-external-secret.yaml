# =============================================================================
# ExternalSecret: holmes shared token (Alertmanager side)
# =============================================================================
# One AWS Secrets Manager value, two independent sync targets: holmes itself
# (panicboat/monorepo, system-components/holmes) syncs the same secret
# separately for its own token verification.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-alertmanager
  namespace: monitoring
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: holmes-alertmanager
    creationPolicy: Owner
  data:
    - secretKey: ALERTMANAGER_SHARED_TOKEN
      remoteRef:
        key: eks/holmes/alertmanager
        property: shared_token

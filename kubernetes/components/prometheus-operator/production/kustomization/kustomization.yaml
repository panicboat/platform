# =============================================================================
# prometheus-operator production kustomization
# =============================================================================
# Overlays chart-out-of-scope resources onto the helmfile output: the
# Grafana admin ExternalSecret (the existing chart-deployed Grafana
# Deployment references its Secret via grafana.admin.existingSecret) and
# the holmes Alertmanager shared-token and Slack notification webhook
# ExternalSecrets.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-admin-external-secret.yaml
  - holmes-alertmanager-external-secret.yaml
  - alertmanager-slack-notify-external-secret.yaml

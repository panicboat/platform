# Uses a dedicated Slack app independent of HolmesGPT so critical alerts function even if Holmes is down.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-notify
  namespace: monitoring
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: alertmanager-slack-notify
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: eks/alertmanager/slack
        property: webhook_url

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: python:3.13-slim
          # =================================================================
          # 意図的な memory leak。8 MiB ずつ確保し limits.memory を超えた
          # 時点で OOMKilled になる。HTTP 応答は daemon thread で返すため、
          # 落ちるまでは frontend から正常に見える。
          #
          # sleep を挟むのは即死を避けるため。起動直後に落ちると Endpoints に
          # 一度も載らず、「backend が一時的に応答していた」という痕跡が
          # metrics に残らない。
          # =================================================================
          command:
            - python
            - -u
            - -c
            - |
              import http.server, socketserver, threading, time

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.end_headers()
                      self.wfile.write(b"backend ok\n")

                  def log_message(self, *args):
                      pass

              socketserver.TCPServer.allow_reuse_address = True
              server = socketserver.TCPServer(("", 8080), Handler)
              threading.Thread(target=server.serve_forever, daemon=True).start()
              print("backend: serving on 8080", flush=True)

              blob = []
              while True:
                  blob.append(bytearray(8 * 1024 * 1024))
                  print(f"backend: allocated {len(blob) * 8} MiB", flush=True)
                  time.sleep(5)
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http

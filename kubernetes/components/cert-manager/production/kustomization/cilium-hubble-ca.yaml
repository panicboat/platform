# Shared root CA certificate for Cilium Hubble mTLS components.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cilium-hubble-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cilium-hubble-ca
  duration: 8760h0m0s
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  secretName: cilium-hubble-ca
---
# Issues hubble-server-certs and hubble-relay-client-certs under a shared CA.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cilium-hubble-ca-issuer
spec:
  ca:
    secretName: cilium-hubble-ca

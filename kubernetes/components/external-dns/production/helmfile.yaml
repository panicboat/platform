environments:
  production:
    # Parent values are not auto-inherited by child helmfiles in helmfile v1.4, requiring explicit redefinition.
    values:
      - cluster:
          # STABLE: deterministic role name configured in aws/eks/modules/addons.tf.
          externalDnsRoleArn: arn:aws:iam::337169763788:role/eks-production-external-dns
---
repositories:
  - name: external-dns
    url: https://kubernetes-sigs.github.io/external-dns

releases:
  - name: external-dns
    namespace: external-dns
    chart: external-dns/external-dns
    version: "1.22.0"
    values:
      - values.yaml.gotmpl

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system-components
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: system-components
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m"]
        # Gt 5 targets generation 6 and above as Kubernetes lacks greater-than-or-equal operators.
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge", "4xlarge"]
        # Must match compute_availability_zone in aws/eks-karpenter/modules/variables.tf to avoid cross-AZ costs.
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-1a"]
      expireAfter: 720h
  disruption:
    # WhenUnderutilized was deprecated in Karpenter v1 in favor of WhenEmptyOrUnderutilized.
    consolidationPolicy: WhenEmptyOrUnderutilized
    # Prevents node churn while instances are booting and initializing CNI.
    consolidateAfter: 5m
  limits:
    cpu: "200"

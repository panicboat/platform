apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: system-components
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        Tier: private
  securityGroupSelectorTerms:
    - tags:
        "aws:eks:cluster-name": eks-production
    - tags:
        Name: private-trust-production
  # STABLE: deterministic node role name configured in aws/eks-karpenter/modules/main.tf.
  role: Karpenter-eks-production
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  # Distinguishes Karpenter-launched AWS resources from IaC-managed ones in AWS Console.
  tags:
    ManagedBy: karpenter

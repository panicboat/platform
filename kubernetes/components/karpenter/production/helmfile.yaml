environments:
  production:
    # Parent values are not auto-inherited by child helmfiles in helmfile v1.4, requiring explicit redefinition.
    values:
      - cluster:
          name: eks-production
        karpenter:
          interruptionQueueName: Karpenter-eks-production
---
# Karpenter chart is distributed via OCI registry without a separate Helm repo.
repositories: []

releases:
  - name: karpenter
    namespace: karpenter
    chart: oci://public.ecr.aws/karpenter/karpenter
    # renovate: datasource=docker depName=public.ecr.aws/karpenter/karpenter
    version: "1.14.0"
    values:
      - values.yaml.gotmpl

environments:
  production:
    # Parent values are not auto-inherited by child helmfiles in helmfile v1.4, requiring explicit redefinition.
    values:
      - tempo:
          bucketName: tempo-337169763788
          bucketPathPrefix: production
---
repositories:
  - name: grafana-community
    url: https://grafana-community.github.io/helm-charts

releases:
  - name: tempo
    namespace: monitoring
    chart: grafana-community/tempo
    version: "2.4.0"
    values:
      - values.yaml.gotmpl

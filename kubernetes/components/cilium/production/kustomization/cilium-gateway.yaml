apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    # Port 8080 avoids conflict with eks-pod-identity-agent on host port 80.
    - name: http
      port: 8080
      protocol: HTTP
      # Allows cross-namespace HTTPRoutes across product namespaces in this single-tenant cluster.
      allowedRoutes:
        namespaces:
          from: All

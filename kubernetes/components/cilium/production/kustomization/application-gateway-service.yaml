# Directly targets cilium-envoy pods because operator Gateway service uses dummy endpoints incompatible with ALB target-type=ip.
apiVersion: v1
kind: Service
metadata:
  name: application-gateway
  namespace: kube-system
spec:
  type: ClusterIP
  # FALLBACK: Targets internal cilium-envoy DaemonSet label which may change on chart upgrades.
  selector:
    k8s-app: cilium-envoy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

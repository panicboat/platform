apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: application
  # Ingress must reside in kube-system because Kubernetes prohibits cross-namespace backends.
  namespace: kube-system
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/group.name: application
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    # Accepts 200-499 so targets stay healthy before HTTPRoutes are attached.
    alb.ingress.kubernetes.io/success-codes: "200-499"
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    external-dns.alpha.kubernetes.io/hostname: dystopia.city
spec:
  ingressClassName: alb
  rules:
    - host: dystopia.city
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: application-gateway
                port:
                  number: 8080

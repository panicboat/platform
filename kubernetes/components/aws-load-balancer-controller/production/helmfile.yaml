environments:
  production:
    # Parent values are not auto-inherited by child helmfiles in helmfile v1.4, requiring explicit redefinition.
    values:
      - cluster:
          # RECREATE: cd aws/vpc/production && TG_TF_PATH=tofu terragrunt output -raw vpc_id
          vpcId: vpc-0407902fa994e8750
          # STABLE: deterministic role name configured in aws/eks/modules/addons.tf.
          albControllerRoleArn: arn:aws:iam::337169763788:role/eks-production-alb-controller
---
repositories:
  - name: eks
    url: https://aws.github.io/eks-charts

releases:
  - name: aws-load-balancer-controller
    namespace: kube-system
    chart: eks/aws-load-balancer-controller
    version: "3.5.0"
    values:
      - values.yaml.gotmpl

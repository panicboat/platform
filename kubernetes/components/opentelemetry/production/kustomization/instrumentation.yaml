apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: panicboat-application
  namespace: default
spec:
  exporter:
    # Node.js auto-instrumentation defaults to HTTP/protobuf, requiring port 4318 instead of gRPC port 4317.
    endpoint: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.62.0
